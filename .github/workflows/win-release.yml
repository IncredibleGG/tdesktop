name: Windows Release.

# Produces the two things a person can actually install: the Inno Setup
# installer and the portable zip, both from a Release build.
#
# This is deliberately separate from win.yml. That one is the fast Debug loop
# that runs on every push; this one builds every third-party library twice
# (Debug *and* Release halves) and then optimises the whole application, so it
# is measured in hours, not minutes. Manual trigger only.

on:
  workflow_dispatch:
    inputs:
      only_cache:
        description: 'Build only the third-party libraries, to fill the cache. Produces no packages.'
        type: boolean
        default: false

jobs:

  windows-release:
    name: Windows Release
    # A cold run has to build Release Qt on top of Debug Qt and may come close
    # to the six hour job limit. If it times out, run once with only_cache set
    # to fill the library cache, then run again to build and package.
    runs-on: windows-latest

    env:
      ONLY_CACHE: ${{ inputs.only_cache }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      # LuminaGram: the account's own api_id, held in this repository's
      # Actions secrets. A build made with TDESKTOP_API_TEST compiles and
      # starts but cannot sign in, so a build meant for a person has to carry
      # real credentials. Both are empty in a fork with no secrets set, and
      # the build step falls back to the test mode there rather than failing.
      LUMINA_API_ID: ${{ secrets.TDESKTOP_API_ID }}
      LUMINA_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
      # The value setup.iss switches on, and the folder the modules live in.
      # Both follow from the one architecture this workflow ships.
      BUILD_TARGET: "win64"
      MODULES_ARCH: "x64"
      # CMake's OUTPUT_NAME for the Telegram target, which setup.iss expects
      # to find next to Updater.exe, and the folder name inside the zip.
      BINARY_NAME: "LuminaGram"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clear the runner's preinstalled toolchains.
        shell: pwsh
        # A Release link of a statically linked Qt + WebRTC needs more room
        # than a hosted runner has left over, and it fails at the very last
        # step of the build - LNK1180, after all 2151 objects are already
        # compiled. The image ships with Android SDKs, CodeQL, SQL Server and
        # a dozen other things this build never touches, so take that space
        # back before anything starts writing.
        #
        # Deliberately kept: Python and Strawberry Perl, which prepare.py and
        # the OpenSSL build run on; chocolatey, which owns the 7-Zip a later
        # step looks for; Visual Studio and the Windows SDK, obviously.
        run: |
          function Show-Space([string]$when) {
            Get-PSDrive -PSProvider FileSystem |
              Where-Object { $_.Free -ne $null } |
              ForEach-Object {
                '{0}  {1}: {2:N1} GB free of {3:N1} GB' -f $when, $_.Name,
                  ($_.Free / 1GB), (($_.Free + $_.Used) / 1GB)
              } | Write-Host
          }
          Show-Space 'before'
          $before = (Get-PSDrive C).Free

          $junk = @(
            'C:\Android'
            'C:\Program Files (x86)\Android'
            'C:\hostedtoolcache\windows\CodeQL'
            'C:\hostedtoolcache\windows\Ruby'
            'C:\hostedtoolcache\windows\go'
            'C:\hostedtoolcache\windows\node'
            'C:\Program Files\Microsoft SQL Server'
            'C:\Program Files (x86)\Microsoft SQL Server'
            'C:\Program Files\MongoDB'
            'C:\Program Files\PostgreSQL'
            'C:\Program Files\MySQL'
            'C:\Program Files\LLVM'
            'C:\Program Files\Unity Hub'
            'C:\Program Files\Amazon'
            'C:\Program Files\Docker'
            'C:\Program Files\Microsoft Service Fabric'
            'C:\Program Files\R'
            'C:\Program Files\Mozilla Firefox'
            'C:\Program Files\Google\Chrome'
            'C:\Program Files (x86)\Google'
            'C:\Program Files\Microsoft SDKs\Azure'
            'C:\Program Files (x86)\Windows Kits\10\Windows Performance Toolkit'
            'C:\Modules'
            'C:\Miniconda'
            'C:\SeleniumWebDrivers'
          )
          # Java lives under a handful of vendor-stamped names, so match it.
          $junk += (Get-ChildItem 'C:\hostedtoolcache\windows' -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'Java_*' } | ForEach-Object { $_.FullName })

          foreach ($path in $junk) {
            if (Test-Path -LiteralPath $path) {
              Write-Host "removing $path"
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          $freed = ((Get-PSDrive C).Free - $before) / 1GB
          Write-Host ('freed {0:N1} GB' -f $freed)
          Show-Space 'after'

      - name: Get repository name.
        shell: bash
        # LuminaGram: a fixed short name, not the repository's own. Every
        # object file is written under this directory, and the deepest of them
        # - kimageformats under Ninja Multi-Config - sits close enough to
        # MSVC's path limit that the ten characters between "tdesktop" and
        # "luminagram-desktop" are the difference between compiling and
        # "fatal error C1083: Cannot open compiler generated file: ''".
        run: echo "REPO_NAME=tdesktop" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: ATL for breakpad.
        shell: pwsh
        # Only the Release half of the Libraries step trips over this, which is
        # why the Debug loop in win.yml never has: prepare.py keeps breakpad's
        # dump_syms.exe behind "release:", and dump_syms is the one thing in the
        # whole tree that includes <atlbase.h> and <atlcomcli.h>. Neither
        # LuminaGram itself nor the three breakpad client libraries CMake links
        # against touches ATL anywhere.
        #
        # The image does ship ATL, but only for its default toolset. This build
        # pins 14.44 - lzma's vcxproj hard-codes v143 - and the image installs
        # that compiler as VC.14.44.17.14.x86.x64 without the matching
        # VC.14.44.17.14.ATL. vcvarsall puts atlmfc\include on INCLUDE only when
        # it exists for the selected toolset, so nothing points at any ATL and
        # the compile dies forty minutes into the step.
        #
        # First choice is the component that matches the toolset, the same one a
        # developer machine would have, and it is worth its five to ten minutes
        # on a build measured in hours. Adding components on a hosted runner is
        # known to fail now and then (actions/runner-images#12880, and #9873 is
        # where the advice to just try it twice comes from), so an installer
        # that will not cooperate falls back to the ATL the image already has
        # rather than losing the run. That pairing is unsupported - it hands the
        # 14.44 linker an atls.lib built by a newer one - but the only binary it
        # can reach is dump_syms.exe, which this workflow never runs, never
        # links into LuminaGram and never ships.
        #
        # The paths are exported by hand either way: vcvarsall ran in the step
        # above and does not run again.
        run: |
          $ErrorActionPreference = 'Stop'
          $component = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'

          # Both come from vcvarsall and both end in a backslash. A quoted path
          # ending in one reads as an escaped quote to the C runtime, so it has
          # to come off before setup.exe ever sees it.
          $vs = "$env:VSINSTALLDIR".TrimEnd('\')
          $tools = "$env:VCToolsInstallDir".TrimEnd('\')
          if (-not $vs -or -not $tools) {
            throw 'VSINSTALLDIR / VCToolsInstallDir are unset - the Native Tools step did not run.'
          }
          Write-Host "Visual Studio: $vs"
          Write-Host "Toolset: $tools"

          # x64 only, matching the arch pinned on the step above.
          function Test-Atl([string]$dir) {
            return (Test-Path (Join-Path $dir 'atlmfc\include\atlbase.h')) -and
              (Test-Path (Join-Path $dir 'atlmfc\lib\x64'))
          }

          if (Test-Atl $tools) {
            Write-Host 'This toolset already carries its own ATL.'
          } else {
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            if (-not (Test-Path $setup)) {
              Write-Warning "No Visual Studio Installer at $setup."
            } else {
              foreach ($attempt in 1..2) {
                Write-Host "Adding $component, attempt $attempt."
                # --wait is a bootstrapper switch that setup.exe rejects, so the
                # waiting happens here. The install path is quoted inside a
                # single argument string: handed over as an array element it
                # would be truncated at the first space.
                $line = 'modify --installPath "{0}" --add {1} --quiet --norestart --nocache' -f $vs, $component
                $p = Start-Process -FilePath $setup -ArgumentList $line -NoNewWindow -PassThru
                if (-not $p.WaitForExit(20 * 60 * 1000)) {
                  # Compiling against a Visual Studio still being rewritten
                  # underneath us is worse than stopping here.
                  throw 'The installer is still running after twenty minutes.'
                }
                # Whether it worked is a question about the disk, not about the
                # exit code - 0, 3010 and 1641 are all successes, and an
                # installer can report one without having installed anything.
                Write-Host "Installer exit code: $($p.ExitCode)."
                if (Test-Atl $tools) { break }
                Write-Warning 'ATL is still not there.'
              }
            }
          }

          $atl = $null
          if (Test-Atl $tools) {
            $atl = $tools
          } else {
            $atl = Get-ChildItem -Path (Join-Path $vs 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              Where-Object { Test-Atl $_.FullName } |
              Select-Object -First 1 -ExpandProperty FullName
            if ($atl) {
              Write-Warning "No ATL for this toolset, falling back to the one in $atl."
            }
          }
          if (-not $atl) {
            throw "There is no ATL under $vs at all, so dump_syms cannot compile. Either $component has to install, or the build has to move to a toolset that ships ATL."
          }

          $include = Join-Path $atl 'atlmfc\include'
          $lib = Join-Path $atl 'atlmfc\lib\x64'
          Write-Host "INCLUDE gains $include"
          Write-Host "LIB gains $lib"
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$include;$env:INCLUDE"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$lib;$env:LIB"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        # Shared with win.yml on purpose: msys64, jom, gyp and python are the
        # same tools whichever configuration is being built.
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        # A key of its own, never win.yml's. That cache holds libraries built
        # with skip-release, so it has no Release halves at all; restoring it
        # here would hand the linker a tree that only looks complete.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-release-v1-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-release-v1-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-release-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-release-

      - name: Libraries.
        # No skip-release here, and that is the whole difference from win.yml.
        # prepare.py scopes every "release:" block behind that option, so with
        # it the Release variants of openssl, zlib, lzma, ffmpeg, Qt and the
        # rest are simply never built - and a Release LuminaGram has nothing
        # to link against. It roughly doubles this step.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Read the API credentials.
        shell: bash
        run: |
          API="-D TDESKTOP_API_TEST=ON"
          if [ -n "$LUMINA_API_ID" ] && [ -n "$LUMINA_API_HASH" ]; then
            echo "Using this account's own credentials."
            API="-D TDESKTOP_API_ID=$LUMINA_API_ID -D TDESKTOP_API_HASH=$LUMINA_API_HASH"
          else
            echo "No credentials in secrets - test mode, this build cannot sign in."
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Read the version.
        shell: bash
        # core/version.h is what the built binary reports, so it is what the
        # packages are named after. Reproducing build.bat's arithmetic:
        #
        #   AppVersionStr      major.minor.patch, always three parts  (:69)
        #   AppVersionStrSmall the same, but "major.minor" when patch is 0
        #   AppVersionStrFull  AppVersionStr, plus ".beta" on the beta
        #                      channel or "_<alpha>" for a closed alpha (:72)
        #
        # and those become iscc's MyAppVersionZero / MyAppVersion /
        # MyAppVersionFull respectively (build.bat:217).
        #
        # The catch is that version.h's own AppVersionStr is *not* build.bat's
        # AppVersionStr - set_version.py writes versionStrSmall into it. So
        # the three parts come from the AppVersion integer, and version.h's
        # string is used only to check the two files still agree.
        run: |
          set -e
          VERSION_H="$TBUILD/$REPO_NAME/Telegram/SourceFiles/core/version.h"

          number=$(sed -n 's/^constexpr auto AppVersion = \([0-9][0-9]*\);.*/\1/p' "$VERSION_H")
          declared=$(sed -n 's/^constexpr auto AppVersionStr = "\([^"]*\)".*/\1/p' "$VERSION_H")
          beta=$(sed -n 's/^constexpr auto AppBetaVersion = \([a-z][a-z]*\);.*/\1/p' "$VERSION_H")
          alpha=$(sed -n 's/^#define TDESKTOP_REQUESTED_ALPHA_VERSION (\([0-9][0-9]*\)ULL).*/\1/p' "$VERSION_H")

          if [ -z "$number" ] || [ -z "$declared" ] || [ -z "$beta" ] || [ -z "$alpha" ]; then
            echo "Could not read the version out of $VERSION_H."
            exit 1
          fi

          major=$(( number / 1000000 ))
          minor=$(( (number / 1000) % 1000 ))
          patch=$(( number % 1000 ))

          zero="$major.$minor.$patch"
          if [ "$patch" -eq 0 ]; then
            small="$major.$minor"
          else
            small="$zero"
          fi

          if [ "$declared" != "$small" ]; then
            echo "version.h disagrees with itself: AppVersion $number means $small,"
            echo "but AppVersionStr says \"$declared\". Run Telegram/build/set_version."
            exit 1
          fi

          if [ "$alpha" != "0" ]; then
            echo "This is a closed alpha ($alpha). That build needs Packer.exe and"
            echo "a signed key file from DesktopPrivate, neither of which exists here,"
            echo "and build.bat skips the installer for it entirely."
            exit 1
          elif [ "$beta" = "true" ]; then
            full="$zero.beta"
          else
            full="$zero"
          fi

          echo "Building $full."
          echo "LG_APP_VERSION=$small" >> $GITHUB_ENV
          echo "LG_APP_VERSION_ZERO=$zero" >> $GITHUB_ENV
          echo "LG_APP_VERSION_FULL=$full" >> $GITHUB_ENV
          echo "LG_SETUP_FILE=tsetup-x64.$full.exe" >> $GITHUB_ENV
          echo "LG_PORTABLE_FILE=tportable-x64.$full.zip" >> $GITHUB_ENV

      - name: Find Inno Setup and 7-Zip.
        shell: pwsh
        # Both ship in the windows runner image, but neither is guaranteed to
        # be on PATH and the Inno Setup directory carries its major version in
        # its name. Look for them, install Inno Setup if it really is absent,
        # and fail here rather than three hours later at packaging time.
        run: |
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ }

          function Find-Iscc {
            $onPath = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
            if ($onPath) { return $onPath }
            foreach ($root in $script:roots) {
              $found = Get-ChildItem -Path $root -Directory -Filter 'Inno Setup *' -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending |
                ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } |
                Where-Object { Test-Path $_ } |
                Select-Object -First 1
              if ($found) { return $found }
            }
            return $null
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host 'Inno Setup not found, installing it.'
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'Inno Setup is not available and could not be installed.' }
          Write-Host "ISCC: $iscc"
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

          $sevenzip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenzip) {
            $sevenzip = $roots |
              ForEach-Object { Join-Path $_ '7-Zip\7z.exe' } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }
          if (-not $sevenzip) { throw '7-Zip is not available.' }
          Write-Host "7z: $sevenzip"
          Add-Content -Path $env:GITHUB_ENV -Value "SEVENZIP=$sevenzip"

          # choco leaves its exit code behind and the pwsh wrapper would hand
          # it back as the step's. Every real failure above threw instead.
          exit 0

      - name: Free up some disk space.
        shell: bash
        run: |
          df -h /c
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: LuminaGram build.
        if: env.ONLY_CACHE == 'false'
        # Differences from win.yml, all of them on purpose:
        #  - Release rather than Debug, which is the point of this workflow.
        #  - No CMAKE_COMPILE_WARNING_AS_ERROR. Every push already has to pass
        #    that gate in win.yml; a release build should not be stopped by a
        #    warning only the optimiser knows how to emit.
        #  - No LTO, unlike build.bat. It is where most of the link time and
        #    memory would go, and this runner has four cores.
        #  - Debug information still off, so no PDBs: nothing we ship contains
        #    them and there is no symbol server to send them to. Drop the
        #    CMAKE_MSVC_DEBUG_INFORMATION_FORMAT line to get them back.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          -G "Ninja Multi-Config" ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF
          if errorlevel 1 exit /b 1

          cmake --build ..\out --config Release --parallel -- -k 0
          if errorlevel 1 exit /b 1

      - name: Check the build output.
        if: env.ONLY_CACHE == 'false'
        run: |
          set "RELEASE_PATH=%TBUILD%\%REPO_NAME%\out\Release"
          echo RELEASE_PATH=%RELEASE_PATH%>>%GITHUB_ENV%
          if not exist "%RELEASE_PATH%\%BINARY_NAME%.exe" (
            echo %BINARY_NAME%.exe not found in %RELEASE_PATH%.
            exit /b 1
          )
          if not exist "%RELEASE_PATH%\Updater.exe" (
            echo Updater.exe not found in %RELEASE_PATH%.
            exit /b 1
          )
          if not exist "%RELEASE_PATH%\modules\%MODULES_ARCH%\d3d\d3dcompiler_47.dll" (
            echo d3dcompiler_47.dll not found - setup.iss and the portable zip both need it.
            exit /b 1
          )

      - name: Build the installer.
        if: env.ONLY_CACHE == 'false'
        # The same defines build.bat passes at :217. SKIP_SIGN is ours: the
        # script's SignTool=sha256 needs a code signing certificate we do not
        # have, so it is compiled out here and only here.
        run: |
          rem One line on purpose. The ^-continued form silently broke here: cmd
          rem ended the command after the first quoted /d argument, so ISCC ran
          rem without the script path and the next line was executed as its own
          rem command. Nothing about that is worth debugging - the whole call is
          rem ~300 characters, far under cmd's 8191 limit.
          "%ISCC%" /dMyAppVersion=%LG_APP_VERSION% /dMyAppVersionZero=%LG_APP_VERSION_ZERO% /dMyAppVersionFull=%LG_APP_VERSION_FULL% "/dReleasePath=%RELEASE_PATH%" "/dMyBuildTarget=%BUILD_TARGET%" /dSKIP_SIGN "%TBUILD%\%REPO_NAME%\Telegram\build\setup.iss"
          if errorlevel 1 exit /b 1

          if not exist "%RELEASE_PATH%\%LG_SETUP_FILE%" (
            echo %LG_SETUP_FILE% was not produced.
            exit /b 1
          )

      - name: Build the portable package.
        if: env.ONLY_CACHE == 'false'
        # build.bat:294-315 - the zip holds one folder named after the binary,
        # containing the executable and the d3d compiler and nothing else.
        # Updater.exe deliberately stays out of it, as it does upstream.
        run: |
          set "PORTABLE_ROOT=%TBUILD%\%REPO_NAME%\out\portable"
          echo PORTABLE_ROOT=%PORTABLE_ROOT%>>%GITHUB_ENV%

          mkdir "%PORTABLE_ROOT%\%BINARY_NAME%\modules\%MODULES_ARCH%\d3d"
          if errorlevel 1 exit /b 1

          copy /Y "%RELEASE_PATH%\%BINARY_NAME%.exe" "%PORTABLE_ROOT%\%BINARY_NAME%\"
          if errorlevel 1 exit /b 1

          rem Upstream leaves Updater.exe out of the portable folder and packs
          rem it into the update package straight from the release directory
          rem instead (build.bat:224). We build the update package out of this
          rem folder, so leaving it out here drops it from the package too -
          rem and a portable install has no Updater.exe of its own to fall back
          rem on, so the update downloads, unpacks, and then nothing happens.
          copy /Y "%RELEASE_PATH%\Updater.exe" "%PORTABLE_ROOT%\%BINARY_NAME%\"
          if errorlevel 1 exit /b 1

          copy /Y "%RELEASE_PATH%\modules\%MODULES_ARCH%\d3d\d3dcompiler_47.dll" "%PORTABLE_ROOT%\%BINARY_NAME%\modules\%MODULES_ARCH%\d3d\"
          if errorlevel 1 exit /b 1

          cd /d "%PORTABLE_ROOT%"

          rem 7z.exe is not a shell builtin, so the folder argument stays
          rem unquoted: a trailing backslash inside quotes is an escaped quote
          rem to the C runtime, and the name has no spaces to protect anyway.
          "%SEVENZIP%" a -mx9 "%LG_PORTABLE_FILE%" %BINARY_NAME%\
          if errorlevel 1 exit /b 1

          "%SEVENZIP%" t "%LG_PORTABLE_FILE%"
          if errorlevel 1 exit /b 1

      - name: Collect artifact.
        if: env.ONLY_CACHE == 'false'
        run: |
          mkdir artifact
          move "%RELEASE_PATH%\%LG_SETUP_FILE%" artifact\
          if errorlevel 1 exit /b 1
          move "%PORTABLE_ROOT%\%LG_PORTABLE_FILE%" artifact\
          if errorlevel 1 exit /b 1

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.ONLY_CACHE == 'false'
        with:
          name: LuminaGram ${{ env.LG_APP_VERSION_FULL }} Windows x64
          # Already compressed, twice over - do not spend minutes on it again.
          compression-level: 0
          path: artifact\

# re-register 2026-09-09T14:07:04Z
